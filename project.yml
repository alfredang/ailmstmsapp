name: TertiaryLearning
options:
  bundleIdPrefix: com.tertiaryinfotech
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    DEVELOPMENT_TEAM: GU9WTSTX9M
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '6'
    CODE_SIGN_STYLE: Automatic
targets:
  TertiaryLearning:
    type: application
    platform: iOS
    sources: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tertiaryinfotech.ailmstms
        TARGETED_DEVICE_FAMILY: '1,2'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: App/Support/Debug.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: App/Support/Release.entitlements
    info:
      path: App/Support/Info.plist
      properties:
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleDisplayName: Tertiary LMS
        CFBundleIconName: AppIcon
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSCalendarsWriteOnlyAccessUsageDescription: Add a class you choose to your calendar.
        NSCalendarsUsageDescription: Add a class you choose to your calendar.
  TertiaryLearningTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: TertiaryLearning
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  TertiaryLearningUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: TertiaryLearning
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TertiaryLearning:
    build:
      targets:
        TertiaryLearning: all
    test:
      targets: [TertiaryLearningTests, TertiaryLearningUITests]
